name: Supabase keep-alive

# Supabase Free pauses projects after ~7 days without database activity.
# This pings both projects every 3 days with a tiny read-only request.
on:
  schedule:
    - cron: "17 0 */3 * *" # 09:17 KST, every 3 days
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kuara's Project
        env:
          KEY: ${{ secrets.KUARA_SUPABASE_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 15 -o /dev/null -w "kuara's Project: HTTP %{http_code}\n" \
            "https://ulrlojfsogtfxkiitbqv.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

      - name: Ping mylovemath
        if: always()
        env:
          KEY: ${{ secrets.MLM_SUPABASE_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 15 -o /dev/null -w "mylovemath: HTTP %{http_code}\n" \
            -X POST "https://vazjunymwgpvmggjufpt.supabase.co/rest/v1/rpc/mlm_public_config" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d "{}"

      # GitHub disables scheduled workflows in public repos after 60 days without
      # repository activity. Re-enabling it on every run keeps this schedule alive.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"